<div class="login-page">
  <div class="login-card">
    <div class="brand-badge">
      <span>{{ brandTitle }}</span>
    </div>

    <h1 class="login-title">Đăng Nhập</h1>
    <p class="login-subtitle">Vui lòng đăng nhập để tiếp tục sử dụng hệ thống</p>

    <form class="login-form" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          class="form-control"
          [class.is-invalid]="!!emailError()"
          placeholder="Nhập địa chỉ email"
          [(ngModel)]="email"
          (ngModelChange)="onEmailInput()"
          (blur)="onEmailBlur()"
          autocomplete="email"
          required
        />
        <p class="field-error" *ngIf="emailError()">{{ emailError() }}</p>
      </div>

      <div class="form-group">
        <label for="password">Mật khẩu</label>
        <div class="password-wrapper">
          <input
            id="password"
            name="password"
            [type]="showPassword() ? 'text' : 'password'"
            class="form-control password-input"
            placeholder="Nhập mật khẩu"
            [(ngModel)]="password"
            autocomplete="current-password"
            required
          />
          <app-password-toggle [(visible)]="showPassword" />
        </div>
      </div>

      <p class="error-text" *ngIf="errorMessage()">{{ errorMessage() }}</p>

      <button type="submit" class="btn-submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Đang xử lý...' : 'Đăng nhập' }}
      </button>
    </form>

    <p class="register-hint">
      Chưa có tài khoản?
      <a routerLink="/register" class="register-link">Đăng ký tài khoản</a>
    </p>
  </div>
</div>
